# Whole stack on one machine: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# A separate project name keeps this away from the dev stack's containers and volumes.
name: ticketrush-prod

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgres://ticketrush:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/ticketrush
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.prod}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env.prod}
  MOCK_PAYMENT_FAILURE_RATE: ${MOCK_PAYMENT_FAILURE_RATE:-0.1}
  CORS_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
  API_URL: http://api:4000 # the mock payment provider calls this API back from inside the network
  TRUST_PROXY: 1 # Caddy is the one proxy in front, so req.ip is the real client

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ticketrush
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketrush']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: api }
    image: ticketrush-api
    command: ['node', 'dist/scripts/migrate.js']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ticketrush-api
    restart: unless-stopped
    init: true
    logging: *logging
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: ticketrush-api
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    init: true
    logging: *logging
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    image: ticketrush-web
    restart: unless-stopped
    init: true
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ['${HTTP_PORT:-80}:80', '443:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

  # One-off: docker compose -f docker-compose.prod.yml --env-file .env.prod --profile tools run --rm seed
  seed:
    image: ticketrush-api
    profiles: [tools]
    command: ['node', 'dist/scripts/seed.js']
    environment:
      <<: *api-env
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
